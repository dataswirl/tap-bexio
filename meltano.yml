version: 1
send_anonymous_usage_stats: false
project_id: tap-bexio
default_environment: dev
environments:
  - name: dev
plugins:
  extractors:
    - name: tap-bexio
      namespace: tap_bexio
      pip_url: -e .
      capabilities:
        - state
        - catalog
        - discover
        - about
        - stream-maps
        - structured-logging
      settings_group_validation:
        - [auth_token]
        - [client_id, client_secret, refresh_token]
      settings:
        - name: auth_token
          kind: string
          label: Access Token
          description: >-
            Bexio Personal Access Token. Leave empty when using client_id, client_secret and refresh_token
          sensitive: true
        - name: client_id
          kind: string
          label: OAuth Client ID
          description: Client ID of the bexio developer portal app (OAuth)
        - name: client_secret
          kind: string
          label: OAuth Client Secret
          description: Client secret of the bexio developer portal app (OAuth)
          sensitive: true
        - name: refresh_token
          kind: string
          label: OAuth Refresh Token
          description: >-
            Offline refresh token, exchanged for an access token on every run. Get one with tap-bexio-auth
          sensitive: true
        - name: oauth_token_url
          kind: string
          value: https://auth.bexio.com/realms/bexio/protocol/openid-connect/token
          label: OAuth Token URL
          description: bexio OpenID Connect token endpoint
        - name: start_date
          kind: date_iso8601
          label: Start Date
          description: >-
            Earliest updated_at to sync for incremental streams, and lower bound for the journal and payroll absences. Without it, the first sync reads everything
        - name: api_url
          kind: string
          value: https://api.bexio.com
          label: API URL
          description: Base URL of the Bexio API
        - name: user_agent
          kind: string
          label: User Agent
          description: Optional User-Agent header sent with every request
        - name: page_size
          kind: integer
          value: 500
          label: Page Size
          description: Records per request (capped per endpoint; 2000 max)
        - name: timezone
          kind: string
          value: Europe/Zurich
          label: Timezone
          description: IANA timezone of Bexio's offset-less timestamps (company timezone). Also decides the day of dates
        - name: output_timezone
          kind: string
          value: UTC
          label: Output Timezone
          description: IANA timezone all timestamps are emitted in. A timezone with summer time gives two offsets, which some targets reject
        - name: forbidden_stream_behavior
          kind: options
          value: skip
          label: Forbidden Stream Behavior
          description: >-
            What to do when Bexio answers 403 (missing scope or inactive module): 'skip' logs a warning and continues, 'fail' stops the sync
          options:
            - label: Skip stream
              value: skip
            - label: Fail sync
              value: fail
  loaders:
    - name: target-jsonl
      variant: andyh1203
